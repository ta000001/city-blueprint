<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>city-blueprint</title>
<meta name="theme-color" content="#10171A">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="city-blueprint">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#10171A; --panel:#172124; --panel2:#1D2A2C; --rule:#2A3B3C;
  --brass:#D4A93C; --brass-dim:#6E5820; --verdigris:#4F8A7B;
  --chalk:#DCE5E2; --dim:#7D908C; --sel:#D4A93C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink)}
body{color:var(--chalk);font-family:'JetBrains Mono',ui-monospace,monospace;
  touch-action:manipulation;-webkit-text-size-adjust:100%;
  padding:max(10px,env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:13px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
h1{font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1;margin:0;color:var(--chalk)}
.sub{font-size:11px;color:var(--dim)}
.ver{font-size:11px;color:var(--brass);border:1px solid var(--brass-dim);border-radius:50%;
  width:18px;height:18px;line-height:16px;text-align:center;cursor:pointer;flex:none}
button,select,input{font-family:inherit;font-size:12px}
button{background:var(--panel2);color:var(--chalk);border:1px solid var(--rule);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--brass-dim)}
button.pri{background:var(--brass-dim);border-color:var(--brass);color:#fff}
button:disabled{opacity:.4;cursor:default}
select,input{background:var(--panel);color:var(--chalk);border:1px solid var(--rule);border-radius:6px;padding:4px 6px}
input[type=number]{width:56px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.wrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:10px;align-items:start}
@media(max-width:720px){.wrap{grid-template-columns:1fr}}
.cols{display:flex;gap:10px;align-items:flex-start}
.cols .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
@media(max-width:860px){.cols{flex-direction:column}}
.sub2{font-size:10px;color:var(--brass);letter-spacing:.08em;margin:8px 0 2px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px}
.panel h2{font-size:12px;color:var(--brass);margin:0 0 6px;font-weight:600;letter-spacing:.04em}
#entries{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto}
#entries li{border:1px solid var(--rule);border-radius:6px;padding:5px 7px;margin-bottom:4px;cursor:pointer;font-size:11px;line-height:1.5}
#entries li.sel{border-color:var(--sel);background:var(--panel2)}
#entries .t{color:var(--brass);font-weight:600}
#entries .m{color:var(--dim)}
.ed{margin-top:4px;font-size:11px}
.ed label{display:inline-block;color:var(--dim);min-width:44px}
.ed .r{margin-bottom:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
canvas{width:100%;height:52vh;background:#0C1214;border:1px solid var(--rule);border-radius:8px;display:block;touch-action:none}
.canbar{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
textarea{width:100%;height:46vh;resize:vertical;background:#0C1214;color:var(--chalk);border:1px solid var(--rule);border-radius:8px;
  font-family:ui-monospace,monospace;font-size:11px;padding:8px;margin-top:8px;white-space:pre;overflow:auto}
#status{font-size:11px;color:var(--dim);min-height:15px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
.modal.on{display:flex}
.modal .m{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;min-width:220px;max-width:88%}
.modal h3{margin:0 0 10px;font-size:13px;color:var(--brass)}
.vrow{font-size:12px;color:var(--brass);line-height:1.9}
.muted{color:var(--dim);font-size:11px}
.modal .m.wide{min-width:340px;max-width:min(560px,94vw);width:560px;max-height:86vh;overflow:auto}
.pfhdr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pf{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:5px 2px;border-bottom:1px solid var(--rule)}
.pf .k{min-width:100px;color:var(--chalk);font-size:11px}
.pf .tag{font-size:9px;color:var(--dim);border:1px solid var(--rule);border-radius:4px;padding:0 3px}
.pf .mode{width:66px}
.pf .ped{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:var(--dim);white-space:nowrap}
.bcrow{display:flex;gap:4px;margin-bottom:3px;align-items:center;flex-basis:100%}
.fr{display:grid;grid-template-columns:1fr 34%;gap:8px;align-items:start;border-bottom:1px solid var(--rule);padding:4px 0}
.fr-head{color:var(--brass);font-size:10px;font-weight:600;letter-spacing:.06em}
.fc-cond{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.fc-cond .k{min-width:62px}
.fc-res{color:var(--chalk);font-size:11px;word-break:break-word;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.ph h2{margin:0}
.htools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="head">
  <h1>city-blueprint</h1>
  <span class="sub">plan.json editor</span>
  <span class="ver" id="ver" title="バージョン">?</span>
  <span style="flex:1"></span>
  <button id="s-open" title="保存先">📁</button>
</div>

<div class="bar">
  <label class="muted">名前 <input id="name" value="my_plan" style="width:120px"></label>
  <button class="pri" id="save">保存</button>
  <button id="open">開く</button>
  <input type="file" id="file" accept=".json" style="display:none">
  <button id="fit">全体表示</button>
  <span style="flex:1"></span>
  <button id="undo" title="戻る (Ctrl+Z)">↶ 戻る</button>
  <button id="redo" title="進む (Ctrl+Y)">↷ 進む</button>
</div>

<div class="cols">
  <div class="col">
    <div class="panel">
      <div class="ph"><h2>配置プレビュー（上=d+ / 右=w+ / 原点=左下）</h2>
        <span class="htools"><select id="addtype"></select><button id="add">＋追加</button><button id="del">削除</button><button id="multi" title="複数選択モード (Ctrl/⌘+クリック・ダブルクリックでも)">複数選択</button><button id="unlink" title="選択中の子/親のgroupを解除">グループ解除</button></span></div>
      <canvas id="cv"></canvas>
      <div class="canbar">
        <button id="zin">＋</button><button id="zout">－</button>
        <span class="muted" id="hint">footprint=本体 / 破線=margin(確保領域) / 塗り=ground</span>
      </div>
    </div>
    <div class="panel">
      <div class="ph"><h2>エントリ（記載順）</h2>
        <span class="htools"><button id="up" title="上へ">↑</button><button id="down" title="下へ">↓</button></span></div>
      <ul id="entries"></ul>
    </div>
  </div>
  <div class="col">
    <div class="panel">
      <h2>パラメータ（選択中エントリ）</h2>
      <div class="sub2">基本</div>
      <div class="ed" id="editor"><span class="muted">エントリを選択</span></div>
      <div class="sub2" id="tphead">type別</div>
      <div class="ed" id="tparams"><span class="muted">—</span></div>
    </div>
    <div class="panel">
      <h2>plan.json</h2>
      <textarea id="json" readonly spellcheck="false" style="margin-top:0"></textarea>
    </div>
  </div>
</div>
<div id="status"></div>

<div class="modal" id="vmodal"><div class="m"><h3>version</h3><div id="vbody"></div></div></div>
<div class="modal" id="smodal"><div class="m"><h3>保存先フォルダ</h3>
  <div id="fs-rows"><div class="vrow" id="dirlabel-plan"></div>
    <div style="margin-top:8px"><button id="pick">plan フォルダを選ぶ</button></div>
    <div class="muted" style="margin-top:6px">mod の data/transaction/plan/ を選ぶと直接保存されます</div></div>
  <div class="muted" id="fs-note" style="display:none">この端末はフォルダ保存に非対応（ダウンロードになります）</div>
</div></div>

<script>
const APP_VERSION='0.1';
const $=s=>document.querySelector(s);
function status(m){ $('#status').textContent=m; clearTimeout(status._t); status._t=setTimeout(()=>{$('#status').textContent='';},4000); }

/* ---------- data (mod から一方向 sync した正典を読む) ---------- */
let SCHEMA=null, PRESETS=null, DICT=[], SCHEMA_VER=null, PRESETS_VER=null, DICT_VER=null;
async function loadData(){
  const s=await fetch('./schema.json?v='+APP_VERSION,{cache:'no-cache'}); SCHEMA=await s.json(); SCHEMA_VER=SCHEMA.version;
  const p=await fetch('./presets.json?v='+APP_VERSION,{cache:'no-cache'}); PRESETS=await p.json(); PRESETS_VER=PRESETS.version;
  try{ const d=await fetch('./dict.json?v='+APP_VERSION,{cache:'no-cache'}); const j=await d.json(); DICT=Array.isArray(j)?j:(j.entries||[]); DICT_VER=(j&&j.version!=null)?j.version:null; }catch(_){}
}
const builderTypes=()=>Object.keys(SCHEMA.builders);
const allTypes=()=>['plan','structure','randomarea',...builderTypes()];
const defaultsOf=t=>((PRESETS.presets[t]&&PRESETS.presets[t].DEFAULTS)||{});
const presetNames=t=>Object.keys(PRESETS.presets[t]||{}).filter(n=>n!=='DEFAULTS');

/* ---------- パラメータ実効値（DEFAULTS→preset→明示・mod Params.resolve と同順） ---------- */
function presetOf(e,t){ const p=e.params||{}; let pn=p.preset; if(pn&&typeof pn==='object') pn=(pn.choice||[])[0]; return (pn&&(PRESETS.presets[t]||{})[pn])||null; }
function effElem(e,t,f){ const p=e.params||{}; if(f in p) return p[f]; const pr=presetOf(e,t); if(pr&&f in pr) return pr[f]; return defaultsOf(t)[f]; }
function specOrValStr(v){ if(v==null) return '—'; if(typeof v==='object'){ if(Array.isArray(v.range)) return 'range '+v.range[0]+'..'+v.range[1]; if(Array.isArray(v.choice)) return 'choice['+v.choice.map(specOrValStr).join(', ')+']'; if(v.form) return v.form+(v.mat?(' '+v.mat):''); return JSON.stringify(v); } return String(v); }
function effDisplay(e,t,f){ return specOrValStr(effElem(e,t,f)); }
// footprint/when 用の代表値（range→min, choice→先頭）
function fieldVal(e,t,f){ let v=effElem(e,t,f); if(v&&typeof v==='object'){ if(Array.isArray(v.range)) return v.range[0]; if(Array.isArray(v.choice)) return v.choice[0]; return undefined; } return v; }
/* ---------- footprint 解決（mod の BuilderSchema を JS で写す） ---------- */
function footprintFor(e){
  const t=e.type, b=SCHEMA.builders[t]; if(!b) return null;
  let fp=b.footprint, row;
  if(Array.isArray(fp)){ row=fp.find(r=>{const w=r.when||{};return Object.keys(w).every(k=>String(fieldVal(e,t,k))===String(w[k]));})||fp[0]; }
  else row=fp;
  const a=row.anchor, aD=(typeof a==='object')?a.d:a, aW=(typeof a==='object')?a.w:a;
  if(row.shape==='RECT'){
    const extD=(+fieldVal(e,t,row.size[0]))||1, extW=(+fieldVal(e,t,row.size[1]))||1;
    const sD=aD==='center'?-((extD-1)>>1):0, sW=aW==='center'?-((extW-1)>>1):0;
    return {shape:'RECT', d0:sD, d1:sD+extD-1, w0:sW, w1:sW+extW-1};
  }
  const dia=(+fieldVal(e,t,row.size[0]))||1;
  return {shape:'CIRCLE', r:dia/2};
}
// margin: RECT={front,back,left,right} or scalar / CIRCLE=scalar(radial)
function marginOf(e){
  const m=e.margin; if(m==null) return {front:0,back:0,left:0,right:0,radial:0};
  if(typeof m==='number') return {front:m,back:m,left:m,right:m,radial:m};
  return {front:m.front||0,back:m.back||0,left:m.left||0,right:m.right||0,radial:0};
}
// relDir 回転 + relPos 平行移動（local d=前, w=右 → world d,w）
function xform(ld,lw,rp,dir){
  let d,w;
  if(dir==='RIGHT'){d=-lw;w=ld;} else if(dir==='BACK'){d=-ld;w=-lw;} else if(dir==='LEFT'){d=lw;w=-ld;} else {d=ld;w=lw;}
  return {d:(rp.d||0)+d, w:(rp.w||0)+w};
}

/* ---------- model ---------- */
let plan={entries:[]}, sel=-1;
let selset=new Set();   // 複数選択（一括削除/移動）。sel=プライマリ（param編集対象）
let multiMode=false;    // 複数選択モード（タップで追加）
let history=[], histIdx=-1, lastHist=0;  // undo/redo
function selOne(i){ sel=i; selset=new Set(i>=0?[i]:[]); }
function selToggle(i){ if(selset.has(i)) selset.delete(i); else selset.add(i); sel=i; }
// 旧 region:{shape,size} を flat(shape/depth/width/diameter) へ移行（⑫）
function migRA(e){ if(e&&e.type==='randomarea'&&e.params&&e.params.region){ const r=e.params.region||{}; e.params.shape=r.shape||'RECT'; if((r.shape||'RECT')==='CIRCLE') e.params.diameter=(r.size&&r.size[0])||20; else { e.params.depth=(r.size&&r.size[0])||20; e.params.width=(r.size&&r.size[1])||20; } delete e.params.region; } if(e&&e.type==='randomarea'&&e.params){ const p=e.params; if(p.depth==null)p.depth=20; if(p.width==null)p.width=20; if(p.diameter==null)p.diameter=20; if(!p.shape)p.shape='RECT'; } return e; }
// undo/redo 履歴（plan スナップショット・連続操作は600msで合流）
function snapshot(){ const s=JSON.stringify(plan), now=Date.now();
  if(histIdx>=0 && history[histIdx]===s) return;
  if(histIdx>=0 && now-lastHist<600){ history[histIdx]=s; lastHist=now; return; }
  history=history.slice(0,histIdx+1); history.push(s); histIdx=history.length-1; lastHist=now;
  if(history.length>120){ history.shift(); histIdx--; } }
function restoreHist(){ plan=JSON.parse(history[histIdx]); sel=-1; selset.clear(); try{localStorage.setItem('city-blueprint:plan',history[histIdx]);}catch(_){ } renderEntries(); renderEditor(); renderJson(); render(); }
function undo(){ if(histIdx>0){ histIdx--; restoreHist(); status('戻る'); } else status('これ以上戻れません'); }
function redo(){ if(histIdx<history.length-1){ histIdx++; restoreHist(); status('進む'); } else status('これ以上進めません'); }
// 一括削除（親 randomarea は紐づく子も削除）(⑬⑭)
function deleteSelected(){ const idxs=selset.size?[...selset]:(sel>=0?[sel]:[]); if(!idxs.length) return;
  const ids=idxs.map(i=>plan.entries[i]).filter(x=>x&&x.type==='randomarea').map(x=>x.params&&x.params.id).filter(Boolean);
  const rm=new Set(idxs); plan.entries.forEach((e,i)=>{ if(e.group&&ids.includes(e.group)) rm.add(i); });
  plan.entries=plan.entries.filter((e,i)=>!rm.has(i)); sel=-1; selset.clear(); persist(); renderEntries(); renderEditor(); status('削除 '+rm.size+'件'); }
// グループ解除（親削除から守りたい子用）(⑭)：親選択→全子のgroup削除 / 子選択→自身のgroup削除
function selHasUnlinkTarget(){ const idxs=selset.size?[...selset]:(sel>=0?[sel]:[]); return idxs.some(i=>{ const e=plan.entries[i]; if(!e) return false; if(e.group) return true; if(e.type==='randomarea'){ const id=e.params&&e.params.id; return plan.entries.some(x=>x.group===id); } return false; }); }
function unlinkSelected(){ const idxs=selset.size?[...selset]:(sel>=0?[sel]:[]);
  const pids=idxs.map(i=>plan.entries[i]).filter(e=>e&&e.type==='randomarea').map(e=>e.params&&e.params.id).filter(Boolean);
  let n=0; plan.entries.forEach(e=>{ if(e.group&&pids.includes(e.group)){ delete e.group; n++; } }); // 親→全子
  idxs.forEach(i=>{ const e=plan.entries[i]; if(e&&e.group){ delete e.group; n++; } });               // 子→自身
  if(n){ persist(); renderEntries(); renderEditor(); status('グループ解除 '+n+'件'); } else status('解除対象がありません'); }
function updateTools(){ const u=$('#unlink'); if(u) u.disabled=!selHasUnlinkTarget(); }
function newEntry(type){
  const e={relPos:{d:0,h:0,w:0}, relDir:'FRONT', type};
  if(type==='plan') e.plan='child.json';
  else if(type==='structure') e.structure='structure.json';
  else if(type==='randomarea') e.params={ id:genId(), shape:'RECT', depth:24, width:24, diameter:24, builder:builderTypes()[0]||'house', source:'DEFAULTS', count:0, rotate:true, gap:0, childMargin:2, seed:Math.floor(Math.random()*1e9) };
  else e.params={};
  return e;
}
function persist(){ try{ localStorage.setItem('city-blueprint:plan', JSON.stringify(plan)); }catch(_){}
  snapshot(); renderJson(); render(); }

/* ---------- entries panel ---------- */
function renderEntries(){
  const ul=$('#entries'); ul.innerHTML='';
  plan.entries.forEach((e,i)=>{
    const li=document.createElement('li'); if(selset.has(i)||i===sel) li.className='sel';
    const rp=e.relPos||{};
    let ref='';
    if(e.type==='plan') ref=e.plan; else if(e.type==='structure') ref=e.structure;
    else if(e.type==='randomarea'){ const id=e.params&&e.params.id; const n=plan.entries.filter(x=>x.group===id).length; ref=(e.params.builder||'?')+'×'+((e.params.count||0)>0?e.params.count:'詰める')+' ('+n+'配置)'; }
    else if(e.cond&&Object.keys(e.cond).length) ref='抽選'+Object.keys(e.cond).length+'項';
    const grp=e.group?(' ⚭'+e.group):'';
    li.innerHTML='<span class="t">'+e.type+'</span> <span class="m">d'+(rp.d||0)+' h'+(rp.h||0)+' w'+(rp.w||0)+' · '+(e.relDir||'FRONT')+(ref?(' · '+ref):'')+grp+'</span>';
    li.onclick=(ev)=>{ if(ev.ctrlKey||ev.metaKey||multiMode) selToggle(i); else selOne(i); cursor={d:(e.relPos&&e.relPos.d)||0,w:(e.relPos&&e.relPos.w)||0}; renderEntries(); renderEditor(); render(); };
    li.ondblclick=()=>{ multiMode=true; updateMultiBtn(); selToggle(i); renderEntries(); renderEditor(); render(); };
    ul.appendChild(li);
  });
  updateTools();
}
function renderEditor(){
  const ed=$('#editor');
  if(sel<0||sel>=plan.entries.length){ ed.innerHTML='<span class="muted">エントリを選択</span>'; renderTParams(); return; }
  const e=plan.entries[sel], rp=e.relPos||(e.relPos={d:0,h:0,w:0});
  let h='';
  h+='<div class="r"><label>relPos</label> d<input type="number" id="e-d" value="'+(rp.d||0)+'"> h<input type="number" id="e-h" value="'+(rp.h||0)+'"> w<input type="number" id="e-w" value="'+(rp.w||0)+'"></div>';
  h+='<div class="r"><label>relDir</label><select id="e-dir">'+['FRONT','RIGHT','BACK','LEFT'].map(d=>'<option'+(e.relDir===d?' selected':'')+'>'+d+'</option>').join('')+'</select></div>';
  if(e.type in SCHEMA.builders){
    h+='<div class="r"><label>margin</label><input type="number" id="e-margin" value="'+(typeof e.margin==='number'?e.margin:'')+'" placeholder="なし"> <span class="muted">一律(スカラ)</span></div>';
    h+='<div class="r"><label>ground</label><input id="e-ground" value="'+(e.ground&&e.ground.mat?e.ground.mat:'')+'" placeholder="mat(例 DIRT)" style="width:110px"> <span class="muted">FULLBLOCK</span></div>';
  }
  ed.innerHTML=h;
  const upd=()=>{ persist(); renderEntries(); };
  $('#e-d').oninput=ev=>{rp.d=+ev.target.value||0; upd();};
  $('#e-h').oninput=ev=>{rp.h=+ev.target.value||0; upd();};
  $('#e-w').oninput=ev=>{rp.w=+ev.target.value||0; upd();};
  $('#e-dir').onchange=ev=>{e.relDir=ev.target.value; upd();};
  if($('#e-margin')) $('#e-margin').oninput=ev=>{ const v=ev.target.value.trim(); if(v==='') delete e.margin; else e.margin=+v||0; persist(); };
  if($('#e-ground')) $('#e-ground').oninput=ev=>{ const v=ev.target.value.trim(); if(v==='') delete e.ground; else e.ground={form:'FULLBLOCK',mat:v.toUpperCase()}; persist(); };
  renderTParams();
}
// type別パラメータ（選択中エントリの params / 参照 / randomarea 条件）をインライン表示
function metaRow(e){ return e.group?('<div class="pf"><span class="k">group</span><span class="muted">'+e.group+'（読み取り）</span></div>'):''; } // ⑪ group を読み取り表示
function hiddenSizeFields(type, probe){ const b=SCHEMA.builders[type]; if(!b||!Array.isArray(b.footprint)) return new Set(); // ⑯ 非活性なサイズ場を隠す
  const active=new Set(footprintSizeFields(type,probe)), hid=new Set();
  b.footprint.forEach(r=>(r.size||[]).forEach(s=>{ if(!active.has(s)) hid.add(s); })); return hid; }

/* ---------- 機能2: パラメータモーダル（schema fields から自動生成・値は固定/範囲/選択） ---------- */
const FORMS=()=>[...new Set(DICT.map(d=>d.form))];
const matsFor=f=>[...new Set(DICT.filter(d=>d.form===f&&d.mat!=null).map(d=>d.mat))];
function asSpec(v){ if(v&&typeof v==='object'&&v.form) return {form:v.form, mat:v.mat}; const f=FORMS()[0]||'FULLBLOCK'; return {form:f, mat:matsFor(f)[0]}; }
function curMode(e,f,k){ const c=e.cond&&e.cond[k]; if(c){ if('range' in c) return 'range'; if('choice' in c) return f.type==='bool'?'random':'choice'; } if(e.params&&e.params[k]!==undefined) return 'fixed'; return 'unset'; }
// cond(抽選条件) を seed で振って params(確定値) を更新。全体の原則=plan.jsonのparamsは常に固定値
function rollEntry(e){ if(!e.cond||!Object.keys(e.cond).length) return; if(e.seed==null) e.seed=Math.floor(Math.random()*1e9); const rng=mulberry32((e.seed|0)||1); e.params=e.params||{}; const fields=SCHEMA.builders[e.type].fields; for(const k of Object.keys(fields)){ if(e.cond[k]!==undefined) e.params[k]=rollElem(e.cond[k],rng); } }
function cleanupCond(e){ if(e.cond&&!Object.keys(e.cond).length){ delete e.cond; delete e.seed; } }
function refreshResolved(e,k){ const s=$('#pres-'+k); if(s) s.textContent=effDisplay(e,e.type,k); }
function applyPreset(e,t,name){ e.params={}; e.cond={};
  if(name){ const pr=(PRESETS.presets[t]||{})[name]||{}; for(const [k,v] of Object.entries(pr)){ const cv=JSON.parse(JSON.stringify(v)); if(cv&&typeof cv==='object'&&(Array.isArray(cv.range)||Array.isArray(cv.choice))) e.cond[k]=cv; else e.params[k]=cv; } }
  cleanupCond(e); rollEntry(e); persist(); renderEntries(); renderTParams(); }
function modesFor(ft){ if(ft==='int') return [['unset','未設定'],['fixed','固定'],['range','範囲'],['choice','選択']]; if(ft==='bool') return [['unset','未設定'],['fixed','固定'],['random','ランダム']]; return [['unset','未設定'],['fixed','固定'],['choice','選択']]; }
function blockspecEditor(k,spec){ const mats=matsFor(spec.form);

function blockspecChoiceEditor(k,arr){ let h='';

function valueEditor(e,t,k,f,mode){ const ft=f.type, cond=(e.cond&&e.cond[k])||null, val=e.params[k];

    if(ft==='enum'){ const cur=(typeof val==='string')?val:effElem(e,t,k); return '<select id="pv-'+k+'">'+f.values.map(o=>'<option'+(o===cur?' selected':'')+'>'+o+'</option>').join('')+'</select>'; }

// 1行=1フィールド：左=抽選条件（モード＋編集）/ 右=抽選結果（確定値）・上下位置が揃う
function fieldRow(e,t,k,f){ const mode=curMode(e,f,k);
  const modeSel='<select class="mode" id="pm-'+k+'">'+modesFor(f.type).map(([v,l])=>'<option value="'+v+'"'+(v===mode?' selected':'')+'>'+l+'</option>').join('')+'</select>';

function light(){ persist(); renderEntries(); } // 本体は再描画しない（入力フォーカス維持）
function setMode(e,t,k,f,mode){ e.params=e.params||{}; e.cond=e.cond||{};
  if(mode==='unset'){ delete e.params[k]; delete e.cond[k]; }
  else if(mode==='fixed'){ delete e.cond[k]; e.params[k]= f.type==='blockspec'?asSpec(effElem(e,t,k)) : f.type==='bool'?(fieldVal(e,t,k)===true) : f.type==='int'?Math.round(fieldVal(e,t,k)||0) : (effElem(e,t,k)!=null?effElem(e,t,k):f.values[0]); }

function wireParamRows(e,t,fields){

      if(f.type==='int'){ const el=$('#pv-'+k); if(el) el.oninput=ev=>{ e.params[k]=Math.round(+ev.target.value||0); refreshResolved(e,k); light(); }; }
      else if(f.type==='bool'){ const el=$('#pv-'+k); if(el) el.onchange=ev=>{ e.params[k]=(ev.target.value==='true'); refreshResolved(e,k); light(); }; }
      else if(f.type==='enum'){ const el=$('#pv-'+k); if(el) el.onchange=ev=>{ e.params[k]=ev.target.value; if(isFootprintDiscriminator(t,k)) renderTParams(); else { refreshResolved(e,k); light(); } }; } // shape等でサイズ場の出し分けを更新
      else if(f.type==='blockspec'){ const bf=$('#pbf-'+k), bm=$('#pbm-'+k);
        if(bf) bf.onchange=()=>{ e.params[k]={form:bf.value, mat:matsFor(bf.value)[0]}; renderTParams(); };
        if(bm) bm.onchange=()=>{ e.params[k]={form:bf.value, mat:bm.value||undefined}; refreshResolved(e,k); light(); }; }
    } else if(mode==='range'){ const a=$('#pr0-'+k), b=$('#pr1-'+k), upd=()=>{ e.cond[k]={range:[Math.round(+a.value||0),Math.round(+b.value||0)]}; rollEntry(e); refreshResolved(e,k); light(); }; if(a)a.oninput=upd; if(b)b.oninput=upd; }
    else if(mode==='choice'){
      if(f.type==='enum'){ document.querySelectorAll('[data-c="'+k+'"]').forEach(cb=>cb.onchange=()=>{ e.cond[k]={choice:[...document.querySelectorAll('[data-c="'+k+'"]')].filter(x=>x.checked).map(x=>x.value)}; rollEntry(e); refreshResolved(e,k); light(); }); }
      else if(f.type==='int'){ const el=$('#pv-'+k); if(el) el.oninput=ev=>{ e.cond[k]={choice: ev.target.value.split(',').map(s=>s.trim()).filter(s=>s!=='').map(Number).filter(n=>!isNaN(n))}; rollEntry(e); refreshResolved(e,k); light(); }; }
      else if(f.type==='blockspec'){ const arr=()=>e.cond[k].choice;
        document.querySelectorAll('[data-bcf="'+k+'"]').forEach(s=>s.onchange=()=>{ arr()[+s.dataset.i]={form:s.value, mat:matsFor(s.value)[0]}; rollEntry(e); persist();renderEntries();renderTParams(); });
        document.querySelectorAll('[data-bcm="'+k+'"]').forEach(s=>s.onchange=()=>{ arr()[+s.dataset.i].mat=s.value; rollEntry(e); persist();renderEntries();renderTParams(); });
        document.querySelectorAll('[data-bcx="'+k+'"]').forEach(b=>b.onclick=()=>{ arr().splice(+b.dataset.i,1); rollEntry(e); persist();renderEntries();renderTParams(); });
        const add=document.querySelector('[data-bca="'+k+'"]'); if(add) add.onclick=()=>{ arr().push(asSpec(effElem(e,t,k))); rollEntry(e); persist();renderEntries();renderTParams(); };

/* ---------- plan.json 直列化（記載規約: relPos→relDir→margin/ground→type→...・1レコード1行） ---------- */
function entryLine(e){
  const rp=e.relPos||{}; const p=[];
  p.push('"relPos": '+JSON.stringify({d:rp.d||0,h:rp.h||0,w:rp.w||0}));
  p.push('"relDir": '+JSON.stringify(e.relDir||'FRONT'));
  if(e.margin!==undefined) p.push('"margin": '+JSON.stringify(e.margin));
  if(e.ground!==undefined) p.push('"ground": '+JSON.stringify(e.ground));
  p.push('"type": '+JSON.stringify(e.type));
  if(e.type==='plan') p.push('"plan": '+JSON.stringify(e.plan||''));
  else if(e.type==='structure') p.push('"structure": '+JSON.stringify(e.structure||''));
  else p.push('"params": '+JSON.stringify(e.params||{}));
  if(e.cond && Object.keys(e.cond).length){ p.push('"cond": '+JSON.stringify(e.cond)); if(e.seed!=null) p.push('"seed": '+JSON.stringify(e.seed)); } // 抽選条件（mod は無視）
  if(e.group) p.push('"group": '+JSON.stringify(e.group)); // 機能3 グルーピング（mod は無視）
  return '{'+p.join(', ')+'}';
}
function metaLine(e){ const rp=e.relPos||{}; const p=[];
  p.push('"relPos": '+JSON.stringify({d:rp.d||0,h:rp.h||0,w:rp.w||0}));
  p.push('"relDir": '+JSON.stringify(e.relDir||'FRONT'));
  p.push('"type": '+JSON.stringify(e.type));
  p.push('"params": '+JSON.stringify(e.params||{}));
  return '{'+p.join(', ')+'}';
}
function buildPlanJson(){
  const ents=plan.entries.filter(e=>e.type!=='randomarea'), metas=plan.entries.filter(e=>e.type==='randomarea');
  let s='{\n  "entries": [\n'+ents.map(e=>'    '+entryLine(e)).join(',\n')+(ents.length?'\n':'')+'  ]';
  if(metas.length) s+=',\n  "meta": [\n'+metas.map(e=>'    '+metaLine(e)).join(',\n')+'\n  ]'; // アプリ専用（mod は entries のみ読む）
  return s+'\n}\n';
}
function renderJson(){ $('#json').value=buildPlanJson(); }

/* ---------- 2D d-w キャンバス ---------- */
const cv=$('#cv'); const ctx=cv.getContext('2d');
let camo={x:40,y:0,scale:5}; // 原点位置(px)・scale=px/block
let cursor={d:0,w:0};        // 空セル選択カーソル（追加のデフォルト位置）
function fitCam(){
  const pts=[]; plan.entries.forEach(e=>{ const w=worldShape(e); if(w) w.pts.forEach(p=>pts.push(p)); else { const c=xform(0,0,e.relPos||{},e.relDir); pts.push({d:c.d,w:c.w}); } });
  pts.push({d:0,w:0});
  let dmin=1e9,dmax=-1e9,wmin=1e9,wmax=-1e9;
  pts.forEach(p=>{dmin=Math.min(dmin,p.d);dmax=Math.max(dmax,p.d);wmin=Math.min(wmin,p.w);wmax=Math.max(wmax,p.w);});
  const pad=6; dmin-=pad;dmax+=pad;wmin-=pad;wmax+=pad;
  const W=cv.width=cv.clientWidth*devicePixelRatio, H=cv.height=cv.clientHeight*devicePixelRatio; // ⑩ フィット前に実サイズを確定
  const sc=Math.max(2,Math.min(W/Math.max(1,(wmax-wmin)), H/Math.max(1,(dmax-dmin))));
  camo.scale=sc;
  camo.x=-wmin*sc; camo.y=H+dmin*sc; // world(w=0)->x=camo.x ; world(d=0)->y=camo.y (d up)
  render();
}
function w2c(d,w){ return [camo.x + w*camo.scale, camo.y - d*camo.scale]; }
// entry の world footprint（描画用の頂点/中心）
function worldShape(e){
  if(e.type==='randomarea') return regionShape(e);
  if(e.type==='plan'||e.type==='structure') return null; // footprint 未算出（marker 表示）
  const fp=footprintFor(e); if(!fp) return null;
  const rp=e.relPos||{}, dir=e.relDir||'FRONT', m=marginOf(e);
  if(fp.shape==='RECT'){
    const corners=(d0,d1,w0,w1)=>[[d0,w0],[d1,w0],[d1,w1],[d0,w1]].map(([ld,lw])=>xform(ld,lw,rp,dir));
    const body=corners(fp.d0,fp.d1,fp.w0,fp.w1);
    const res=corners(fp.d0-m.back,fp.d1+m.front,fp.w0-m.left,fp.w1+m.right);
    return {shape:'RECT', pts:body, body, reserved:res, ground:e.ground};
  }
  const c=xform(0,0,rp,dir);
  const pts=[]; for(let a=0;a<360;a+=30){ const rad=a*Math.PI/180; pts.push({d:c.d+fp.r*Math.cos(rad), w:c.w+fp.r*Math.sin(rad)}); }
  return {shape:'CIRCLE', center:c, r:fp.r, rr:fp.r+m.radial, pts, ground:e.ground};
}
// ---------- 重なり判定（確保領域 = footprint + margin）----------
function reservedRegion(e){
  if(e.type==='randomarea') return null; // 領域は重なり判定対象外
  const sh=worldShape(e); if(!sh) return null; // plan/structure(marker) は footprint なし→対象外
  if(sh.shape==='RECT'){ const ds=sh.reserved.map(p=>p.d), ws=sh.reserved.map(p=>p.w);
    return {kind:'rect', d0:Math.min(...ds), d1:Math.max(...ds), w0:Math.min(...ws), w1:Math.max(...ws)}; }
  return {kind:'circle', cd:sh.center.d, cw:sh.center.w, r:sh.rr};
}
function bodyRegion(e){
  if(e.type==='randomarea') return null; // 領域は重なり判定対象外
  const sh=worldShape(e); if(!sh) return null; // marker は対象外
  if(sh.shape==='RECT'){ const ds=sh.body.map(p=>p.d), ws=sh.body.map(p=>p.w);
    return {kind:'rect', d0:Math.min(...ds), d1:Math.max(...ds), w0:Math.min(...ws), w1:Math.max(...ws)}; }
  return {kind:'circle', cd:sh.center.d, cw:sh.center.w, r:sh.r};
}
function regOverlap(a,b){
  if(!a||!b) return false;
  if(a.kind==='rect'&&b.kind==='rect') return a.d0<=b.d1 && b.d0<=a.d1 && a.w0<=b.w1 && b.w0<=a.w1; // 整数ブロックの包含判定
  if(a.kind==='circle'&&b.kind==='circle') return Math.hypot(a.cd-b.cd,a.cw-b.cw) < a.r+b.r;
  const r=a.kind==='rect'?a:b, c=a.kind==='circle'?a:b;
  const nd=Math.max(r.d0,Math.min(c.cd,r.d1)), nw=Math.max(r.w0,Math.min(c.cw,r.w1));
  return Math.hypot(c.cd-nd,c.cw-nw) < c.r;
}
function computeOverlaps(){
  const bodies=plan.entries.map(bodyRegion), reserved=plan.entries.map(reservedRegion);
  const bodyBad=new Set(), marginBad=new Set(); let bodyPairs=0, marginPairs=0;
  for(let i=0;i<plan.entries.length;i++) for(let j=i+1;j<plan.entries.length;j++){
    if(regOverlap(bodies[i],bodies[j])){ bodyBad.add(i); bodyBad.add(j); bodyPairs++; }               // 本体(footprint)が重なる=物理的衝突
    else if(regOverlap(reserved[i],reserved[j])){ marginBad.add(i); marginBad.add(j); marginPairs++; } // 本体は離れているがマージン(確保領域)だけ重なる
  }
  return {bodyBad, marginBad, bodyPairs, marginPairs};
}
// クリック位置にある全エントリ（面積が小さい順）→ 完全に重なっても小さい方を掴める
function entryArea(e){
  const sh=worldShape(e); if(!sh) return 0; // plan/structure marker は最小扱い
  if(sh.shape==='RECT'){ const ds=sh.body.map(p=>p.d),ws=sh.body.map(p=>p.w); return (Math.max(...ds)-Math.min(...ds)+1)*(Math.max(...ws)-Math.min(...ws)+1); }
  return Math.PI*sh.r*sh.r;
}
function candidatesAt(d,w,px,py){
  const list=[];
  plan.entries.forEach((e,i)=>{
    const sh=worldShape(e);
    if(!sh){ const c=xform(0,0,e.relPos||{},e.relDir); const [x,y]=w2c(c.d,c.w); if(Math.hypot(px-x,py-y)<=10*devicePixelRatio) list.push(i); return; }
    if(sh.shape==='RECT'){ const ds=sh.body.map(p=>p.d),ws=sh.body.map(p=>p.w); if(d>=Math.min(...ds)&&d<=Math.max(...ds)&&w>=Math.min(...ws)&&w<=Math.max(...ws)) list.push(i); }
    else if(Math.hypot(d-sh.center.d,w-sh.center.w)<=sh.r) list.push(i);
  });
  list.sort((a,b)=>(entryArea(plan.entries[a])-entryArea(plan.entries[b]))||(b-a)); // 面積昇順・同面積は前面(後勝ち)優先
  return list;
}
let hitSig='', hitIdx=0;
function pickAt(d,w,px,py){
  const cands=candidatesAt(d,w,px,py);
  if(!cands.length){ hitSig=''; hitIdx=0; return -1; }
  const sig=cands.join(',');                 // 同じ重なり集合を再クリック→下の要素へ周回
  if(sig===hitSig) hitIdx=(hitIdx+1)%cands.length; else { hitSig=sig; hitIdx=0; }
  if(cands.length>1) status('重なり'+cands.length+'件 — '+(hitIdx+1)+'/'+cands.length+'（'+plan.entries[cands[hitIdx]].type+'）選択・同じ場所を再クリックで切替');
  return cands[hitIdx];
}
function syncEditorPos(){ const e=plan.entries[sel]; if(!e||!e.relPos) return; const dd=$('#e-d'), dw=$('#e-w'); if(dd) dd.value=e.relPos.d||0; if(dw) dw.value=e.relPos.w||0; }
function render(){
  const W=cv.width=cv.clientWidth*devicePixelRatio, H=cv.height=cv.clientHeight*devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  if(!SCHEMA) return;
  // grid
  ctx.strokeStyle='#16211F'; ctx.lineWidth=1;
  const step=Math.max(1,Math.round(10*devicePixelRatio/camo.scale))*camo.scale;
  for(let x=camo.x%step;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=camo.y%step;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // 目盛ラベル（グリッド間隔ごとの world 座標：上辺=w / 左辺=d）
  ctx.fillStyle='#4A5A57'; ctx.font=(9*devicePixelRatio)+'px monospace';
  ctx.textBaseline='top'; for(let x=camo.x%step;x<W;x+=step){ ctx.fillText(''+Math.round((x-camo.x)/camo.scale), x+2*devicePixelRatio, 2*devicePixelRatio); }
  ctx.textBaseline='alphabetic'; for(let y=camo.y%step;y<H;y+=step){ ctx.fillText(''+Math.round((camo.y-y)/camo.scale), 2*devicePixelRatio, y-2*devicePixelRatio); }

  // entries

      ctx.fillStyle=on?'#D4A93C':'#4F8A7B'; ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
      ctx.fillStyle='#DCE5E2';ctx.font=(11*devicePixelRatio)+'px monospace';ctx.fillText(e.type,x+8,y-6);
      return;
    }
    const ov=ovl.bodyBad.has(i)?'body':ovl.marginBad.has(i)?'margin':null; // 本体重なり=赤 / マージンのみ重なり=橙
    const ovCol=ov==='body'?'#D24B4B':ov==='margin'?'#D9902B':null;
    const ovFill=ov==='body'?'rgba(210,75,75,.16)':ov==='margin'?'rgba(217,144,43,.16)':null;
    if(sh.shape==='RECT'){
      // 確保領域(reserved): 本体重なり=赤 / マージン重なり=橙 / ground有=緑 / それ以外=枠のみ

      ctx.setLineDash([5,4]); ctx.strokeStyle=ovCol||'#6E5820'; ctx.lineWidth=ov?1.6:1; poly(sh.reserved); ctx.stroke(); ctx.setLineDash([]);
      // body（本体重なりは赤で強調）

      ctx.strokeStyle=on?'#D4A93C':(ov==='body'?'#D24B4B':'#9fb0ac'); ctx.lineWidth=on?2:1.2; poly(sh.body); ctx.fill(); ctx.stroke();
    } else {

      else if(sh.ground){ ctx.fillStyle='rgba(79,138,123,.18)'; ctx.beginPath();ctx.arc(cx,cy,sh.rr*camo.scale,0,7);ctx.fill(); }
      ctx.setLineDash([5,4]); ctx.strokeStyle=ovCol||'#6E5820'; ctx.lineWidth=ov?1.6:1; ctx.beginPath();ctx.arc(cx,cy,sh.rr*camo.scale,0,7);ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=ov==='body'?'rgba(210,75,75,.24)':(on?'rgba(212,169,60,.22)':'rgba(220,229,226,.10)');
      ctx.strokeStyle=on?'#D4A93C':(ov==='body'?'#D24B4B':'#9fb0ac'); ctx.lineWidth=on?2:1.2;
      ctx.beginPath();ctx.arc(cx,cy,sh.r*camo.scale,0,7);ctx.fill();ctx.stroke();
    }
    const c0=w2c((e.relPos||{}).d||0,(e.relPos||{}).w||0);
    ctx.fillStyle='#DCE5E2';ctx.font=(11*devicePixelRatio)+'px monospace';ctx.fillText(e.type,c0[0]+4,c0[1]-4);
  });
  { const bn=ovl.bodyPairs, mn=ovl.marginPairs;
    if(bn||mn){ ctx.fillStyle=bn?'#D24B4B':'#D9902B'; ctx.font='bold '+(13*devicePixelRatio)+'px monospace'; ctx.fillText('conflict: (body:'+bn+'、margin:'+mn+')', 8*devicePixelRatio, 20*devicePixelRatio); } }
  // 空セル選択カーソル＋現在座標
  const cp=(sel>=0&&plan.entries[sel]&&plan.entries[sel].relPos)?{d:plan.entries[sel].relPos.d||0,w:plan.entries[sel].relPos.w||0}:{d:cursor.d,w:cursor.w};
  if(sel<0){ const [mx,my]=w2c(cursor.d,cursor.w); ctx.strokeStyle='#D4A93C'; ctx.lineWidth=1.2; ctx.setLineDash([3,2]); ctx.strokeRect(mx-6,my-6,12,12); ctx.setLineDash([]); }
  ctx.fillStyle='#9fb0ac'; ctx.font=(11*devicePixelRatio)+'px monospace'; ctx.textAlign='left';
  ctx.fillText((sel>=0?'sel ':'cursor ')+'d'+cp.d+' w'+cp.w, 8*devicePixelRatio, H-8*devicePixelRatio);
  function poly(pts){ ctx.beginPath(); pts.forEach((p,k)=>{const [x,y]=w2c(p.d,p.w); k?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.closePath(); }
}

/* ---------- 機能3: ランダム配置（randomarea = 散布ジョブ／設計時に確定・不確定要素は mod に渡さない） ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function genId(){ let mx=0; plan.entries.forEach(e=>{ const m=((e.type==='randomarea'&&e.params&&e.params.id)||'').match(/^r(\d+)$/); if(m) mx=Math.max(mx,+m[1]); }); return 'r'+(mx+1); } // 連番
// randomarea の領域 footprint（params.region → world 図形）
function regionShape(e){
  const p=e.params||{}, shp=p.shape||'RECT', rp=e.relPos||{}, dir=e.relDir||'FRONT';
  if(shp==='RECT'){ const extD=(+p.depth)||1, extW=(+p.width)||1;
    const corners=(d0,d1,w0,w1)=>[[d0,w0],[d1,w0],[d1,w1],[d0,w1]].map(([ld,lw])=>xform(ld,lw,rp,dir));
    const body=corners(0,extD-1,0,extW-1); return {shape:'RECT', pts:body, body, reserved:body, region:true}; }
  const c=xform(0,0,rp,dir), r=((+p.diameter)||2)/2, pts=[];
  for(let a=0;a<360;a+=30){ const rad=a*Math.PI/180; pts.push({d:c.d+r*Math.cos(rad), w:c.w+r*Math.sin(rad)}); }
  return {shape:'CIRCLE', center:c, r, rr:r, pts, reserved:pts, region:true};
}
function drawRegion(e,onSel){ const sh=regionShape(e);
  ctx.setLineDash([2,3]); ctx.lineWidth=onSel?2:1.2; ctx.strokeStyle=onSel?'#D4A93C':'#8A6E20'; ctx.fillStyle='rgba(212,169,60,.06)';
  if(sh.shape==='RECT'){ ctx.beginPath(); sh.body.forEach((pt,k)=>{const [x,y]=w2c(pt.d,pt.w); k?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else { const [cx,cy]=w2c(sh.center.d,sh.center.w); ctx.beginPath();ctx.arc(cx,cy,sh.r*camo.scale,0,7);ctx.fill();ctx.stroke(); }
  ctx.setLineDash([]);
  const c0=w2c((e.relPos||{}).d||0,(e.relPos||{}).w||0); ctx.fillStyle='#D4A93C'; ctx.font=(11*devicePixelRatio)+'px monospace'; ctx.fillText('▦ randomarea '+((e.params&&e.params.id)||''), c0[0]+4, c0[1]-4);
}
// 領域(world) / 子の確保領域 bbox / フィット判定
function regionWorld(m){ const sh=regionShape(m);
  if(sh.shape==='RECT'){ const ds=sh.body.map(p=>p.d),ws=sh.body.map(p=>p.w); return {shape:'RECT', d0:Math.min(...ds),d1:Math.max(...ds),w0:Math.min(...ws),w1:Math.max(...ws)}; }
  return {shape:'CIRCLE', cd:sh.center.d, cw:sh.center.w, r:sh.r}; }
// 領域を footprint が内包するエントリ（＝城壁などの囲い）は除外対象外
function enclosesRegion(e, reg){ const b=bodyRegion(e); if(!b) return false;
  let rd0,rd1,rw0,rw1;
  if(reg.shape==='RECT'){ rd0=reg.d0;rd1=reg.d1;rw0=reg.w0;rw1=reg.w1; } else { rd0=reg.cd-reg.r;rd1=reg.cd+reg.r;rw0=reg.cw-reg.r;rw1=reg.cw+reg.r; }
  if(b.kind==='rect') return b.d0<=rd0 && b.d1>=rd1 && b.w0<=rw0 && b.w1>=rw1;
  return [[rd0,rw0],[rd1,rw0],[rd1,rw1],[rd0,rw1]].every(([d,w])=>Math.hypot(d-b.cd,w-b.cw)<=b.r); }
function reservedBBox(child){ const rr=reservedRegion(child); if(!rr) return null; if(rr.kind==='rect') return {d0:rr.d0,d1:rr.d1,w0:rr.w0,w1:rr.w1}; return {d0:rr.cd-rr.r,d1:rr.cd+rr.r,w0:rr.cw-rr.r,w1:rr.cw+rr.r}; }
function inflate(r,g){ if(!r||!g) return r; if(r.kind==='rect') return {kind:'rect',d0:r.d0-g,d1:r.d1+g,w0:r.w0-g,w1:r.w1+g}; return {kind:'circle',cd:r.cd,cw:r.cw,r:r.r+g}; }
function regionContains(reg, child){ const b=reservedBBox(child); if(!b) return false;
  if(reg.shape==='RECT') return b.d0>=reg.d0 && b.d1<=reg.d1 && b.w0>=reg.w0 && b.w1<=reg.w1;
  return [[b.d0,b.w0],[b.d1,b.w0],[b.d1,b.w1],[b.d0,b.w1]].every(([d,w])=>Math.hypot(d-reg.cd,w-reg.cw)<=reg.r); }
function randomFitPos(child, reg, rng){
  const saved=child.relPos; child.relPos={d:0,h:0,w:0}; const b=reservedBBox(child); child.relPos=saved; if(!b) return null;
  if(reg.shape==='RECT'){ const loD=reg.d0-b.d0, hiD=reg.d1-b.d1, loW=reg.w0-b.w0, hiW=reg.w1-b.w1; if(loD>hiD||loW>hiW) return null;
    return {d:Math.round(loD+rng()*(hiD-loD)), w:Math.round(loW+rng()*(hiW-loW))}; }
  const halfD=(b.d1-b.d0)/2, halfW=(b.w1-b.w0)/2, maxOff=reg.r-Math.max(halfD,halfW); if(maxOff<0) return null;
  const ang=rng()*2*Math.PI, rad=Math.sqrt(rng())*maxOff, cx=reg.cd+rad*Math.cos(ang), cw=reg.cw+rad*Math.sin(ang);
  return {d:Math.round(cx-(b.d0+b.d1)/2), w:Math.round(cw-(b.w0+b.w1)/2)}; }
// preset の range/choice をアプリ側で振って固定値へ（不確定要素を mod に持ち込まない）
function rollElem(v,rng){ if(v&&typeof v==='object'){ if(Array.isArray(v.range)){ const a=v.range[0],b=v.range[1]; return a+Math.floor(rng()*(b-a+1)); } if(Array.isArray(v.choice)) return rollElem(v.choice[Math.floor(rng()*v.choice.length)],rng); if(v.form) return {form:v.form, mat:v.mat}; } return v; }
function rollParams(bt, source, rng){ const out={}; if(source && source!=='DEFAULTS'){ const pr=(PRESETS.presets[bt]||{})[source]||{}; for(const [k,v] of Object.entries(pr)) out[k]=rollElem(v,rng); } return out; }
// footprint の size に使うフィールド名（schema footprint.size を動的に解決）
function footprintSizeFields(type, probe){
  const b=SCHEMA.builders[type]; if(!b||!b.footprint) return [];
  let fp=b.footprint, row;
  if(Array.isArray(fp)){ row=fp.find(r=>{const w=r.when||{}; return Object.keys(w).every(k=>String(probe[k])===String(w[k]));})||fp[0]; } else row=fp;
  return row.size||[];
}
function scatterArea(m){
  const p=m.params, id=p.id, bt=p.builder, src=p.source, cm=p.childMargin|0, gap=p.gap|0, target=p.count|0;
  plan.entries=plan.entries.filter(e=>e.group!==id);   // 既存の子を除去（再抽選）
  const rng=mulberry32((p.seed|0)||1), reg=regionWorld(m);
  const exclude=plan.entries.filter(e=>e.type!=='randomarea' && !enclosesRegion(e,reg)).map(reservedRegion).filter(Boolean); // 領域自身＋領域を内包する囲い(城壁等)は除外対象外
  const tmpl=rollParams(bt,src,rng);                   // footprint サイズ場は子ごとに振らず全子で固定（重なり/パッキング安定）
  const sizeFields=footprintSizeFields(bt, Object.assign({}, defaultsOf(bt), tmpl));
  const placed=[]; let made=0, attempts=0; const maxA=(target>0?target:150)*50+800;
  while(attempts<maxA && (target===0 || made<target)){
    attempts++;
    const dir=p.rotate ? ['FRONT','RIGHT','BACK','LEFT'][Math.floor(rng()*4)] : 'FRONT';
    const params=rollParams(bt,src,rng);
    for(const sf of sizeFields){ if(sf in tmpl) params[sf]=tmpl[sf]; } // サイズは全子共通に固定
    const child={type:bt, relDir:dir, relPos:{d:0,h:0,w:0}, params, group:id};
    if(cm>0) child.margin=cm;
    const pos=randomFitPos(child, reg, rng); if(!pos) continue;
    child.relPos={d:pos.d,h:0,w:pos.w};
    if(!regionContains(reg, child)) continue;
    const rr=reservedRegion(child); if(!rr) continue;
    if(exclude.some(x=>regOverlap(inflate(rr,gap),x)) || placed.some(x=>regOverlap(inflate(rr,gap),x))) continue;
    plan.entries.push(child); placed.push(rr); made++;
  }
  selOne(plan.entries.indexOf(m)); persist(); renderEntries(); renderEditor(); render();
  status('抽選: '+made+' 件配置'+(target>0&&made<target?'（'+target+' に届かず・領域/間隔を確認）':''));
}
// randomarea の params を物理名・1列・descriptor 駆動で表示（type別の他と同様に動的生成）
// 他type同様フラットな物理名（shape/depth/width/diameter…）。id は変更不可で表示（⑪）
function raFields(e){ const rect=((e.params.shape||'RECT')==='RECT');
  return [['id','ro'],['shape','enum2']].concat(rect?[['depth','int'],['width','int']]:[['diameter','int']])
    .concat([['builder','enum'],['source','enum'],['count','int'],['rotate','bool'],['gap','int'],['childMargin','int'],['seed','int']]); }
function raEditor(e,k,kind){ const p=e.params, v=p[k];
  if(kind==='ro') return '<span class="muted">'+(v==null?'—':v)+'</span>';
  if(kind==='enum2') return '<select id="ra-'+k+'"><option'+(v==='RECT'?' selected':'')+'>RECT</option><option'+(v==='CIRCLE'?' selected':'')+'>CIRCLE</option></select>';
  if(kind==='enum'){ const vals=(k==='builder')?builderTypes():['DEFAULTS',...presetNames(p.builder)]; return '<select id="ra-'+k+'">'+vals.map(o=>'<option'+(v===o?' selected':'')+'>'+o+'</option>').join('')+'</select>'; }
  if(kind==='bool') return '<label class="chk"><input type="checkbox" id="ra-'+k+'"'+(v?' checked':'')+'></label>';
  return '<input type="number" id="ra-'+k+'" value="'+(v||0)+'">'; }
function randomEditorRows(e){
  let h=raFields(e).map(([k,kind])=>'<div class="pf"><span class="k">'+k+'</span><span class="ped">'+raEditor(e,k,kind)+'</span></div>').join('');
  h+='<div class="pf"><span class="k"></span><button class="pri" id="ra-run">抽選</button><button id="ra-clear">子削除</button></div>';
  return h; }
function wireRandomEditor(e){ const p=e.params;
  raFields(e).forEach(([k,kind])=>{
    if(kind==='ro') return;
    const el=$('#ra-'+k); if(!el) return;
    if(kind==='enum2') el.onchange=()=>{ p.shape=el.value; persist();renderEntries();renderTParams();render(); }; // RECT↔CIRCLE で depth/width ↔ diameter 切替
    else if(kind==='bool') el.onchange=()=>{ p[k]=el.checked; persist(); };
    else if(kind==='enum') el.onchange=()=>{ p[k]=el.value; if(k==='builder') p.source='DEFAULTS'; persist();renderEntries();renderTParams(); };
    else { const min=(k==='depth'||k==='width'||k==='diameter')?1:0; el.oninput=()=>{ p[k]=Math.max(min,Math.round(+el.value||0)); persist();renderEntries();render(); }; }
  });
  $('#ra-run').onclick=()=>{ p.seed=Math.floor(Math.random()*1e9); scatterArea(e); };
  $('#ra-clear').onclick=()=>{ plan.entries=plan.entries.filter(x=>x.group!==p.id); sel=-1; selset.clear(); persist();renderEntries();renderEditor();render(); status('子を削除'); };
}

/* ---------- 保存先（File System Access API + IndexedDB）: mc-blueprint から流用 ---------- */
const FS_OK=!!(window.showDirectoryPicker);
function idb(mode,fn){ return new Promise((res,rej)=>{ const r=indexedDB.open('cb',1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
  r.onsuccess=()=>{ const tx=r.result.transaction('kv',mode); const out=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(out&&out.result); tx.onerror=()=>rej(tx.error); };
  r.onerror=()=>rej(r.error); }); }
const idbSet=(k,v)=>idb('readwrite',s=>s.put(v,k)), idbGet=k=>idb('readonly',s=>s.get(k));
async function ensurePerm(h){ const o={mode:'readwrite'}; if(await h.queryPermission(o)==='granted') return true; return (await h.requestPermission(o))==='granted'; }
let DIR=null;
function updateDirLabel(){ const el=$('#dirlabel-plan'); if(!el) return; el.textContent=FS_OK?(DIR?('plan → '+DIR.name+'/ に上書き保存'):'plan → 未設定（ダウンロード）'):''; $('#fs-note').style.display=FS_OK?'none':''; $('#fs-rows').style.display=FS_OK?'':'none'; }
async function pickDir(){ if(!FS_OK){status('この端末は保存先指定に非対応');return;} try{ const h=await window.showDirectoryPicker({mode:'readwrite',id:'cb-plan'}); DIR=h; try{await idbSet('dir_plan',h);}catch(_){} updateDirLabel(); status('保存先: '+h.name); }catch(_){} }
async function saveFile(text,fname){
  if(DIR){ try{ if(await ensurePerm(DIR)){ const fh=await DIR.getFileHandle(fname,{create:true}); const w=await fh.createWritable(); await w.write(text); await w.close(); status('保存: '+DIR.name+'/'+fname); return; } }catch(_){} status('保存先に書けません→ダウンロード'); }
  const b=new Blob([text],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); status('保存（ダウンロード）');
}

/* ---------- open plan.json ---------- */
function importPlan(text){
  try{ const d=JSON.parse(text); if(!d||!Array.isArray(d.entries)) throw 0;
    const norm=e=>migRA({relPos:{d:(e.relPos&&e.relPos.d)||0,h:(e.relPos&&e.relPos.h)||0,w:(e.relPos&&e.relPos.w)||0},relDir:e.relDir||'FRONT',...e});
    const ents=d.entries.map(norm), metas=(Array.isArray(d.meta)?d.meta:[]).map(norm);
    const out=[], used=new Set();                       // 各 randomarea の直後にその子を並べる
    metas.forEach(m=>{ out.push(m); const id=m.params&&m.params.id; ents.forEach(c=>{ if(id!=null&&c.group===id){ out.push(c); used.add(c); } }); });
    ents.forEach(c=>{ if(!used.has(c)) out.push(c); });
    plan={entries:out}; selOne(-1); persist(); renderEntries(); renderEditor(); fitCam(); status('読込: entries '+ents.length+' / meta '+metas.length);
  }catch(_){ status('plan.json の解析に失敗'); }
}

  $('#file').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importPlan(r.result); r.readAsText(f); ev.target.value=''; };
  $('#fit').onclick=fitCam;
  $('#zin').onclick=()=>{camo.scale*=1.25;render();};
  $('#zout').onclick=()=>{camo.scale/=1.25;render();};
  $('#ver').onclick=()=>$('#vmodal').classList.add('on');
  $('#vmodal').onclick=e=>{if(e.target.id==='vmodal')$('#vmodal').classList.remove('on');};
  $('#s-open').onclick=()=>{updateDirLabel();$('#smodal').classList.add('on');};
  $('#smodal').onclick=e=>{if(e.target.id==='smodal')$('#smodal').classList.remove('on');};
  $('#pick').onclick=pickDir;
  // canvas: エントリを掴んで配置（relPos.d/w をブロック単位で決定）/ 空きはパン
  let drag=null;
  function ptWorld(e){ const r=cv.getBoundingClientRect(); const px=(e.clientX-r.left)*devicePixelRatio, py=(e.clientY-r.top)*devicePixelRatio; return {px,py, d:(camo.y-py)/camo.scale, w:(px-camo.x)/camo.scale}; }
  cv.onpointerdown=e=>{
    const p=ptWorld(e), hit=pickAt(p.d,p.w,p.px,p.py); cv.setPointerCapture(e.pointerId);
    if(hit>=0){
      const additive=e.ctrlKey||e.metaKey||multiMode, wasSel=selset.has(hit);
      if(additive){ if(!wasSel) selToggle(hit); else sel=hit; } else { if(!wasSel) selOne(hit); else sel=hit; }
      const rp=plan.entries[hit].relPos||(plan.entries[hit].relPos={d:0,h:0,w:0}); cursor={d:rp.d||0,w:rp.w||0};
      const grp=(selset.size>1&&selset.has(hit))?[...selset].map(idx=>({idx,d:plan.entries[idx].relPos.d||0,w:plan.entries[idx].relPos.w||0})):null;
      drag={mode:'entry', gd:p.d-(rp.d||0), gw:p.w-(rp.w||0), pd:(rp.d||0), pw:(rp.w||0), grp, additive, wasSel, hit, moved:false};
      renderEntries(); renderEditor(); render();
    }
    else drag={mode:'pan', x:e.clientX, y:e.clientY, ox:camo.x, oy:camo.y, moved:false, cd:Math.round(p.d), cw:Math.round(p.w)};
  };
  cv.onpointermove=e=>{
    if(!drag){ const p=ptWorld(e); cv.style.cursor=candidatesAt(p.d,p.w,p.px,p.py).length?'grab':'default'; return; }
    if(drag.mode==='pan'){ if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3) drag.moved=true; camo.x=drag.ox+(e.clientX-drag.x)*devicePixelRatio; camo.y=drag.oy+(e.clientY-drag.y)*devicePixelRatio; render(); return; }
    const p=ptWorld(e), nd=Math.round(p.d-drag.gd), nw=Math.round(p.w-drag.gw);
    if(nd!==drag.pd||nw!==drag.pw) drag.moved=true;
    if(drag.grp){ const dd=nd-drag.pd, dw=nw-drag.pw; drag.grp.forEach(s=>{ const rp=plan.entries[s.idx].relPos; rp.d=s.d+dd; rp.w=s.w+dw; }); }
    else { const rp=plan.entries[sel].relPos; rp.d=nd; rp.w=nw; }
    cursor={d:nd,w:nw}; cv.style.cursor='grabbing'; render(); syncEditorPos();
  };
  cv.onpointerup=()=>{
    if(drag&&drag.mode==='entry'){
      if(drag.moved){ persist(); renderEntries(); renderEditor(); }
      else if(drag.additive&&drag.wasSel){ selToggle(drag.hit); renderEntries(); renderEditor(); render(); } // 追加選択のタップ(無移動)で解除
      else { renderEntries(); renderEditor(); render(); }
    }
    else if(drag&&drag.mode==='pan'&&!drag.moved){ cursor={d:drag.cd,w:drag.cw}; selOne(-1); renderEntries(); renderEditor(); render(); } // 空セル選択
    drag=null; cv.style.cursor='default';
  };
  cv.ondblclick=e=>{ const p=ptWorld(e), hit=pickAt(p.d,p.w,p.px,p.py); if(hit>=0){ multiMode=true; updateMultiBtn(); if(!selset.has(hit)) selToggle(hit); sel=hit; renderEntries(); renderEditor(); render(); } }; // ダブルクリックで複数選択モード開始
  // キーボード: R=回転 / Ctrl+Z=戻る / Ctrl+Shift+Z・Ctrl+Y=進む
  addEventListener('keydown',e=>{
    const t=(e.target.tagName||'').toLowerCase(); if(t==='input'||t==='select'||t==='textarea') return;
    if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='Y')){ e.preventDefault(); redo(); return; }
    if((e.key==='r'||e.key==='R')&&sel>=0&&sel<plan.entries.length){ const o=['FRONT','RIGHT','BACK','LEFT']; const en=plan.entries[sel]; en.relDir=o[(o.indexOf(en.relDir||'FRONT')+1)%4]; persist(); renderEntries(); renderEditor(); }
  });
  addEventListener('resize',render);
  // restore local plan
  try{ const raw=localStorage.getItem('city-blueprint:plan'); if(raw){ const d=JSON.parse(raw); if(d&&Array.isArray(d.entries)){ d.entries.forEach(migRA); plan=d; } } }catch(_){}
  updateMultiBtn(); snapshot(); // 初期状態を履歴に
}
function updateMultiBtn(){ const b=$('#multi'); if(b){ b.classList.toggle('pri',multiMode); b.textContent=multiMode?'複数:ON':'複数選択'; } }
function fillVer(){ $('#vbody').innerHTML=['app '+APP_VERSION,'schema '+(SCHEMA_VER??'?'),'presets '+(PRESETS_VER??'?'),'dict '+(DICT_VER??'?')].map(s=>'<div class="vrow">'+s+'</div>').join(''); }

boot();
loadData().then(()=>{ $('#addtype').innerHTML=allTypes().map(t=>'<option>'+t+'</option>').join(''); fillVer(); renderEntries(); renderEditor(); renderJson(); requestAnimationFrame(fitCam); status('schema/presets 読込 OK'); })
  .catch(err=>{ console.error(err); status('schema.json/presets.json を読めません（sync-from-mod を実行）'); });
updateDirLabel();
if(FS_OK) idbGet('dir_plan').then(h=>{ if(h){ DIR=h; updateDirLabel(); } }).catch(()=>{});
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
