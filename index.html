<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>city-blueprint</title>
<meta name="theme-color" content="#10171A">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="city-blueprint">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --ink:#10171A; --panel:#172124; --panel2:#1D2A2C; --rule:#2A3B3C;
  --brass:#D4A93C; --brass-dim:#6E5820; --verdigris:#4F8A7B;
  --chalk:#DCE5E2; --dim:#7D908C; --sel:#D4A93C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink)}
body{color:var(--chalk);font-family:'JetBrains Mono',ui-monospace,monospace;
  touch-action:manipulation;-webkit-text-size-adjust:100%;
  padding:max(10px,env(safe-area-inset-top)) 10px calc(16px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-size:13px}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
h1{font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1;margin:0;color:var(--chalk)}
.sub{font-size:11px;color:var(--dim)}
.ver{font-size:11px;color:var(--brass);border:1px solid var(--brass-dim);border-radius:50%;
  width:18px;height:18px;line-height:16px;text-align:center;cursor:pointer;flex:none}
button,select,input{font-family:inherit;font-size:12px}
button{background:var(--panel2);color:var(--chalk);border:1px solid var(--rule);border-radius:6px;padding:5px 9px;cursor:pointer}
button:hover{border-color:var(--brass-dim)}
button.pri{background:var(--brass-dim);border-color:var(--brass);color:#fff}
button:disabled{opacity:.4;cursor:default}
select,input{background:var(--panel);color:var(--chalk);border:1px solid var(--rule);border-radius:6px;padding:4px 6px}
input[type=number]{width:56px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.wrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:10px;align-items:start}
@media(max-width:720px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px}
.panel h2{font-size:12px;color:var(--brass);margin:0 0 6px;font-weight:600;letter-spacing:.04em}
#entries{list-style:none;margin:0;padding:0;max-height:38vh;overflow:auto}
#entries li{border:1px solid var(--rule);border-radius:6px;padding:5px 7px;margin-bottom:4px;cursor:pointer;font-size:11px;line-height:1.5}
#entries li.sel{border-color:var(--sel);background:var(--panel2)}
#entries .t{color:var(--brass);font-weight:600}
#entries .m{color:var(--dim)}
.ed{margin-top:8px;border-top:1px solid var(--rule);padding-top:8px;font-size:11px}
.ed label{display:inline-block;color:var(--dim);min-width:44px}
.ed .r{margin-bottom:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
canvas{width:100%;height:52vh;background:#0C1214;border:1px solid var(--rule);border-radius:8px;display:block;touch-action:none}
.canbar{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
textarea{width:100%;height:22vh;background:#0C1214;color:var(--chalk);border:1px solid var(--rule);border-radius:8px;
  font-family:ui-monospace,monospace;font-size:11px;padding:8px;margin-top:8px;white-space:pre;overflow:auto}
#status{font-size:11px;color:var(--dim);min-height:15px;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60}
.modal.on{display:flex}
.modal .m{background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:16px 18px;min-width:220px;max-width:88%}
.modal h3{margin:0 0 10px;font-size:13px;color:var(--brass)}
.vrow{font-size:12px;color:var(--brass);line-height:1.9}
.muted{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<div class="head">
  <h1>city-blueprint</h1>
  <span class="sub">plan.json editor</span>
  <span class="ver" id="ver" title="バージョン">?</span>
  <span style="flex:1"></span>
  <button id="s-open" title="保存先">📁</button>
</div>

<div class="bar">
  <label class="muted">名前 <input id="name" value="my_plan" style="width:120px"></label>
  <button class="pri" id="save">保存</button>
  <button id="open">開く</button>
  <input type="file" id="file" accept=".json" style="display:none">
  <button id="fit">全体表示</button>
</div>

<div class="wrap">
  <div class="panel">
    <h2>エントリ（記載順）</h2>
    <div class="bar" style="margin-bottom:6px">
      <select id="addtype"></select>
      <button id="add">＋追加</button>
    </div>
    <ul id="entries"></ul>
    <div class="ed" id="editor"><span class="muted">エントリを選択</span></div>
  </div>
  <div>
    <div class="panel">
      <h2>配置プレビュー（上=d+ / 右=w+ / 原点=左下）</h2>
      <canvas id="cv"></canvas>
      <div class="canbar">
        <button id="zin">＋</button><button id="zout">－</button>
        <span class="muted" id="hint">footprint=本体 / 破線=margin(確保領域) / 塗り=ground</span>
      </div>
    </div>
    <textarea id="json" readonly spellcheck="false"></textarea>
  </div>
</div>
<div id="status"></div>

<div class="modal" id="vmodal"><div class="m"><h3>version</h3><div id="vbody"></div></div></div>
<div class="modal" id="smodal"><div class="m"><h3>保存先フォルダ</h3>
  <div id="fs-rows"><div class="vrow" id="dirlabel-plan"></div>
    <div style="margin-top:8px"><button id="pick">plan フォルダを選ぶ</button></div>
    <div class="muted" style="margin-top:6px">mod の data/transaction/plan/ を選ぶと直接保存されます</div></div>
  <div class="muted" id="fs-note" style="display:none">この端末はフォルダ保存に非対応（ダウンロードになります）</div>
</div></div>

<script>
const APP_VERSION='0.1';
const $=s=>document.querySelector(s);
function status(m){ $('#status').textContent=m; clearTimeout(status._t); status._t=setTimeout(()=>{$('#status').textContent='';},4000); }

/* ---------- data (mod から一方向 sync した正典を読む) ---------- */
let SCHEMA=null, PRESETS=null, DICT=[], SCHEMA_VER=null, PRESETS_VER=null, DICT_VER=null;
async function loadData(){
  const s=await fetch('./schema.json?v='+APP_VERSION,{cache:'no-cache'}); SCHEMA=await s.json(); SCHEMA_VER=SCHEMA.version;
  const p=await fetch('./presets.json?v='+APP_VERSION,{cache:'no-cache'}); PRESETS=await p.json(); PRESETS_VER=PRESETS.version;
  try{ const d=await fetch('./dict.json?v='+APP_VERSION,{cache:'no-cache'}); const j=await d.json(); DICT=Array.isArray(j)?j:(j.entries||[]); DICT_VER=(j&&j.version!=null)?j.version:null; }catch(_){}
}
const builderTypes=()=>Object.keys(SCHEMA.builders);
const allTypes=()=>['plan','structure',...builderTypes()];
const defaultsOf=t=>((PRESETS.presets[t]&&PRESETS.presets[t].DEFAULTS)||{});
const presetNames=t=>Object.keys(PRESETS.presets[t]||{}).filter(n=>n!=='DEFAULTS');

/* ---------- footprint 解決（mod の BuilderSchema を JS で写す） ---------- */
function fieldVal(e,t,f){ const p=e.params||{}; if(f in p && p[f]!=null && typeof p[f]!=='object') return p[f]; const d=defaultsOf(t); return d[f]; }
function footprintFor(e){
  const t=e.type, b=SCHEMA.builders[t]; if(!b) return null;
  let fp=b.footprint, row;
  if(Array.isArray(fp)){ row=fp.find(r=>{const w=r.when||{};return Object.keys(w).every(k=>String(fieldVal(e,t,k))===String(w[k]));})||fp[0]; }
  else row=fp;
  const a=row.anchor, aD=(typeof a==='object')?a.d:a, aW=(typeof a==='object')?a.w:a;
  if(row.shape==='RECT'){
    const extD=(+fieldVal(e,t,row.size[0]))||1, extW=(+fieldVal(e,t,row.size[1]))||1;
    const sD=aD==='center'?-((extD-1)>>1):0, sW=aW==='center'?-((extW-1)>>1):0;
    return {shape:'RECT', d0:sD, d1:sD+extD-1, w0:sW, w1:sW+extW-1};
  }
  const dia=(+fieldVal(e,t,row.size[0]))||1;
  return {shape:'CIRCLE', r:dia/2};
}
// margin: RECT={front,back,left,right} or scalar / CIRCLE=scalar(radial)
function marginOf(e){
  const m=e.margin; if(m==null) return {front:0,back:0,left:0,right:0,radial:0};
  if(typeof m==='number') return {front:m,back:m,left:m,right:m,radial:m};
  return {front:m.front||0,back:m.back||0,left:m.left||0,right:m.right||0,radial:0};
}
// relDir 回転 + relPos 平行移動（local d=前, w=右 → world d,w）
function xform(ld,lw,rp,dir){
  let d,w;
  if(dir==='RIGHT'){d=-lw;w=ld;} else if(dir==='BACK'){d=-ld;w=-lw;} else if(dir==='LEFT'){d=lw;w=-ld;} else {d=ld;w=lw;}
  return {d:(rp.d||0)+d, w:(rp.w||0)+w};
}

/* ---------- model ---------- */
let plan={entries:[]}, sel=-1;
function newEntry(type){
  const e={relPos:{d:0,h:0,w:0}, relDir:'FRONT', type};
  if(type==='plan') e.plan='child.json';
  else if(type==='structure') e.structure='structure.json';
  else e.params={};
  return e;
}
function persist(){ try{ localStorage.setItem('city-blueprint:plan', JSON.stringify(plan)); }catch(_){}
  renderJson(); render(); }

/* ---------- entries panel ---------- */
function renderEntries(){
  const ul=$('#entries'); ul.innerHTML='';
  plan.entries.forEach((e,i)=>{
    const li=document.createElement('li'); if(i===sel) li.className='sel';
    const rp=e.relPos||{}; const ref=e.type==='plan'?e.plan:e.type==='structure'?e.structure:(e.params&&e.params.preset?('preset:'+e.params.preset):'');
    li.innerHTML='<span class="t">'+e.type+'</span> <span class="m">d'+(rp.d||0)+' h'+(rp.h||0)+' w'+(rp.w||0)+' · '+(e.relDir||'FRONT')+(ref?(' · '+ref):'')+'</span>';
    li.onclick=()=>{ sel=i; renderEntries(); renderEditor(); render(); };
    ul.appendChild(li);
  });
}
function renderEditor(){
  const ed=$('#editor');
  if(sel<0||sel>=plan.entries.length){ ed.innerHTML='<span class="muted">エントリを選択</span>'; return; }
  const e=plan.entries[sel], rp=e.relPos||(e.relPos={d:0,h:0,w:0});
  let h='';
  h+='<div class="r"><label>relPos</label> d<input type="number" id="e-d" value="'+(rp.d||0)+'"> h<input type="number" id="e-h" value="'+(rp.h||0)+'"> w<input type="number" id="e-w" value="'+(rp.w||0)+'"></div>';
  h+='<div class="r"><label>relDir</label><select id="e-dir">'+['FRONT','RIGHT','BACK','LEFT'].map(d=>'<option'+(e.relDir===d?' selected':'')+'>'+d+'</option>').join('')+'</select></div>';
  if(e.type==='plan') h+='<div class="r"><label>plan</label><input id="e-ref" value="'+(e.plan||'')+'" style="flex:1;min-width:100px"></div>';
  else if(e.type==='structure') h+='<div class="r"><label>structure</label><input id="e-ref" value="'+(e.structure||'')+'" style="flex:1;min-width:100px"></div>';
  else {
    const pn=presetNames(e.type);
    h+='<div class="r"><label>preset</label><select id="e-preset"><option value="">(なし)</option>'+pn.map(n=>'<option'+(e.params&&e.params.preset===n?' selected':'')+'>'+n+'</option>').join('')+'</select> <button id="e-params">パラメータ…</button></div>';
  }
  h+='<div class="r"><label>margin</label><input type="number" id="e-margin" value="'+(typeof e.margin==='number'?e.margin:'')+'" placeholder="なし"> <span class="muted">一律(スカラ)</span></div>';
  h+='<div class="r"><label>ground</label><input id="e-ground" value="'+(e.ground&&e.ground.mat?e.ground.mat:'')+'" placeholder="mat(例 DIRT)" style="width:110px"> <span class="muted">FULLBLOCK</span></div>';
  h+='<div class="r"><button id="e-up">↑</button><button id="e-down">↓</button><button id="e-del">削除</button></div>';
  ed.innerHTML=h;
  const upd=()=>{ persist(); renderEntries(); };
  $('#e-d').oninput=ev=>{rp.d=+ev.target.value||0; upd();};
  $('#e-h').oninput=ev=>{rp.h=+ev.target.value||0; upd();};
  $('#e-w').oninput=ev=>{rp.w=+ev.target.value||0; upd();};
  $('#e-dir').onchange=ev=>{e.relDir=ev.target.value; upd();};
  if($('#e-ref')) $('#e-ref').oninput=ev=>{ if(e.type==='plan') e.plan=ev.target.value; else e.structure=ev.target.value; upd(); };
  if($('#e-preset')) $('#e-preset').onchange=ev=>{ e.params=e.params||{}; if(ev.target.value) e.params.preset=ev.target.value; else delete e.params.preset; upd(); };
  if($('#e-params')) $('#e-params').onclick=()=>status('パラメータ編集モーダルは機能2で実装予定');
  $('#e-margin').oninput=ev=>{ const v=ev.target.value.trim(); if(v==='') delete e.margin; else e.margin=+v||0; persist(); };
  $('#e-ground').oninput=ev=>{ const v=ev.target.value.trim(); if(v==='') delete e.ground; else e.ground={form:'FULLBLOCK',mat:v.toUpperCase()}; persist(); };
  $('#e-up').onclick=()=>{ if(sel>0){ [plan.entries[sel-1],plan.entries[sel]]=[plan.entries[sel],plan.entries[sel-1]]; sel--; persist(); renderEntries(); } };
  $('#e-down').onclick=()=>{ if(sel<plan.entries.length-1){ [plan.entries[sel+1],plan.entries[sel]]=[plan.entries[sel],plan.entries[sel+1]]; sel++; persist(); renderEntries(); } };
  $('#e-del').onclick=()=>{ plan.entries.splice(sel,1); sel=-1; persist(); renderEntries(); renderEditor(); };
}

/* ---------- plan.json 直列化（記載規約: relPos→relDir→margin/ground→type→...・1レコード1行） ---------- */
function entryLine(e){
  const rp=e.relPos||{}; const p=[];
  p.push('"relPos": '+JSON.stringify({d:rp.d||0,h:rp.h||0,w:rp.w||0}));
  p.push('"relDir": '+JSON.stringify(e.relDir||'FRONT'));
  if(e.margin!==undefined) p.push('"margin": '+JSON.stringify(e.margin));
  if(e.ground!==undefined) p.push('"ground": '+JSON.stringify(e.ground));
  p.push('"type": '+JSON.stringify(e.type));
  if(e.type==='plan') p.push('"plan": '+JSON.stringify(e.plan||''));
  else if(e.type==='structure') p.push('"structure": '+JSON.stringify(e.structure||''));
  else p.push('"params": '+JSON.stringify(e.params||{}));
  return '{'+p.join(', ')+'}';
}
function buildPlanJson(){
  return '{\n  "entries": [\n'+plan.entries.map(e=>'    '+entryLine(e)).join(',\n')+(plan.entries.length?'\n':'')+'  ]\n}\n';
}
function renderJson(){ $('#json').value=buildPlanJson(); }

/* ---------- 2D d-w キャンバス ---------- */
const cv=$('#cv'); const ctx=cv.getContext('2d');
let camo={x:40,y:0,scale:5}; // 原点位置(px)・scale=px/block
function fitCam(){
  const pts=[]; plan.entries.forEach(e=>{ const w=worldShape(e); if(w) w.pts.forEach(p=>pts.push(p)); else { const c=xform(0,0,e.relPos||{},e.relDir); pts.push({d:c.d,w:c.w}); } });
  pts.push({d:0,w:0});
  let dmin=1e9,dmax=-1e9,wmin=1e9,wmax=-1e9;
  pts.forEach(p=>{dmin=Math.min(dmin,p.d);dmax=Math.max(dmax,p.d);wmin=Math.min(wmin,p.w);wmax=Math.max(wmax,p.w);});
  const pad=6; dmin-=pad;dmax+=pad;wmin-=pad;wmax+=pad;
  const W=cv.width, H=cv.height;
  const sc=Math.max(2,Math.min(W/Math.max(1,(wmax-wmin)), H/Math.max(1,(dmax-dmin))));
  camo.scale=sc;
  camo.x=-wmin*sc; camo.y=H+dmin*sc; // world(w=0)->x=camo.x ; world(d=0)->y=camo.y (d up)
  render();
}
function w2c(d,w){ return [camo.x + w*camo.scale, camo.y - d*camo.scale]; }
// entry の world footprint（描画用の頂点/中心）
function worldShape(e){
  if(e.type==='plan'||e.type==='structure') return null; // footprint 未算出（marker 表示）
  const fp=footprintFor(e); if(!fp) return null;
  const rp=e.relPos||{}, dir=e.relDir||'FRONT', m=marginOf(e);
  if(fp.shape==='RECT'){
    const corners=(d0,d1,w0,w1)=>[[d0,w0],[d1,w0],[d1,w1],[d0,w1]].map(([ld,lw])=>xform(ld,lw,rp,dir));
    const body=corners(fp.d0,fp.d1,fp.w0,fp.w1);
    const res=corners(fp.d0-m.back,fp.d1+m.front,fp.w0-m.left,fp.w1+m.right);
    return {shape:'RECT', pts:body, body, reserved:res, ground:e.ground};
  }
  const c=xform(0,0,rp,dir);
  const pts=[]; for(let a=0;a<360;a+=30){ const rad=a*Math.PI/180; pts.push({d:c.d+fp.r*Math.cos(rad), w:c.w+fp.r*Math.sin(rad)}); }
  return {shape:'CIRCLE', center:c, r:fp.r, rr:fp.r+m.radial, pts, ground:e.ground};
}
// ---------- 重なり判定（確保領域 = footprint + margin）----------
function reservedRegion(e){
  const sh=worldShape(e); if(!sh) return null; // plan/structure(marker) は footprint なし→対象外
  if(sh.shape==='RECT'){ const ds=sh.reserved.map(p=>p.d), ws=sh.reserved.map(p=>p.w);
    return {kind:'rect', d0:Math.min(...ds), d1:Math.max(...ds), w0:Math.min(...ws), w1:Math.max(...ws)}; }
  return {kind:'circle', cd:sh.center.d, cw:sh.center.w, r:sh.rr};
}
function bodyRegion(e){
  const sh=worldShape(e); if(!sh) return null; // marker は対象外
  if(sh.shape==='RECT'){ const ds=sh.body.map(p=>p.d), ws=sh.body.map(p=>p.w);
    return {kind:'rect', d0:Math.min(...ds), d1:Math.max(...ds), w0:Math.min(...ws), w1:Math.max(...ws)}; }
  return {kind:'circle', cd:sh.center.d, cw:sh.center.w, r:sh.r};
}
function regOverlap(a,b){
  if(!a||!b) return false;
  if(a.kind==='rect'&&b.kind==='rect') return a.d0<=b.d1 && b.d0<=a.d1 && a.w0<=b.w1 && b.w0<=a.w1; // 整数ブロックの包含判定
  if(a.kind==='circle'&&b.kind==='circle') return Math.hypot(a.cd-b.cd,a.cw-b.cw) < a.r+b.r;
  const r=a.kind==='rect'?a:b, c=a.kind==='circle'?a:b;
  const nd=Math.max(r.d0,Math.min(c.cd,r.d1)), nw=Math.max(r.w0,Math.min(c.cw,r.w1));
  return Math.hypot(c.cd-nd,c.cw-nw) < c.r;
}
function computeOverlaps(){
  const bodies=plan.entries.map(bodyRegion), reserved=plan.entries.map(reservedRegion);
  const bodyBad=new Set(), marginBad=new Set(); let bodyPairs=0, marginPairs=0;
  for(let i=0;i<plan.entries.length;i++) for(let j=i+1;j<plan.entries.length;j++){
    if(regOverlap(bodies[i],bodies[j])){ bodyBad.add(i); bodyBad.add(j); bodyPairs++; }               // 本体(footprint)が重なる=物理的衝突
    else if(regOverlap(reserved[i],reserved[j])){ marginBad.add(i); marginBad.add(j); marginPairs++; } // 本体は離れているがマージン(確保領域)だけ重なる
  }
  return {bodyBad, marginBad, bodyPairs, marginPairs};
}
// クリック位置にある全エントリ（面積が小さい順）→ 完全に重なっても小さい方を掴める
function entryArea(e){
  const sh=worldShape(e); if(!sh) return 0; // plan/structure marker は最小扱い
  if(sh.shape==='RECT'){ const ds=sh.body.map(p=>p.d),ws=sh.body.map(p=>p.w); return (Math.max(...ds)-Math.min(...ds)+1)*(Math.max(...ws)-Math.min(...ws)+1); }
  return Math.PI*sh.r*sh.r;
}
function candidatesAt(d,w,px,py){
  const list=[];
  plan.entries.forEach((e,i)=>{
    const sh=worldShape(e);
    if(!sh){ const c=xform(0,0,e.relPos||{},e.relDir); const [x,y]=w2c(c.d,c.w); if(Math.hypot(px-x,py-y)<=10*devicePixelRatio) list.push(i); return; }
    if(sh.shape==='RECT'){ const ds=sh.body.map(p=>p.d),ws=sh.body.map(p=>p.w); if(d>=Math.min(...ds)&&d<=Math.max(...ds)&&w>=Math.min(...ws)&&w<=Math.max(...ws)) list.push(i); }
    else if(Math.hypot(d-sh.center.d,w-sh.center.w)<=sh.r) list.push(i);
  });
  list.sort((a,b)=>(entryArea(plan.entries[a])-entryArea(plan.entries[b]))||(b-a)); // 面積昇順・同面積は前面(後勝ち)優先
  return list;
}
let hitSig='', hitIdx=0;
function pickAt(d,w,px,py){
  const cands=candidatesAt(d,w,px,py);
  if(!cands.length){ hitSig=''; hitIdx=0; return -1; }
  const sig=cands.join(',');                 // 同じ重なり集合を再クリック→下の要素へ周回
  if(sig===hitSig) hitIdx=(hitIdx+1)%cands.length; else { hitSig=sig; hitIdx=0; }
  if(cands.length>1) status('重なり'+cands.length+'件 — '+(hitIdx+1)+'/'+cands.length+'（'+plan.entries[cands[hitIdx]].type+'）選択・同じ場所を再クリックで切替');
  return cands[hitIdx];
}
function syncEditorPos(){ const e=plan.entries[sel]; if(!e||!e.relPos) return; const dd=$('#e-d'), dw=$('#e-w'); if(dd) dd.value=e.relPos.d||0; if(dw) dw.value=e.relPos.w||0; }
function render(){
  const W=cv.width=cv.clientWidth*devicePixelRatio, H=cv.height=cv.clientHeight*devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  if(!SCHEMA) return;
  // grid
  ctx.strokeStyle='#16211F'; ctx.lineWidth=1;
  const step=Math.max(1,Math.round(10*devicePixelRatio/camo.scale))*camo.scale;
  for(let x=camo.x%step;x<W;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=camo.y%step;y<H;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // origin
  const [ox,oy]=w2c(0,0);
  ctx.strokeStyle='#4F8A7B'; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(ox-8,oy);ctx.lineTo(ox+8,oy);ctx.moveTo(ox,oy-8);ctx.lineTo(ox,oy+8);ctx.stroke();
  // entries
  const ovl=computeOverlaps();
  plan.entries.forEach((e,i)=>{
    const sh=worldShape(e); const on=(i===sel);
    if(!sh){ // plan/structure marker
      const c=xform(0,0,e.relPos||{},e.relDir); const [x,y]=w2c(c.d,c.w);
      ctx.fillStyle=on?'#D4A93C':'#4F8A7B'; ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();
      ctx.fillStyle='#DCE5E2';ctx.font=(11*devicePixelRatio)+'px monospace';ctx.fillText(e.type,x+8,y-6);
      return;
    }
    const ov=ovl.bodyBad.has(i)?'body':ovl.marginBad.has(i)?'margin':null; // 本体重なり=赤 / マージンのみ重なり=橙
    const ovCol=ov==='body'?'#D24B4B':ov==='margin'?'#D9902B':null;
    const ovFill=ov==='body'?'rgba(210,75,75,.16)':ov==='margin'?'rgba(217,144,43,.16)':null;
    if(sh.shape==='RECT'){
      // 確保領域(reserved): 本体重なり=赤 / マージン重なり=橙 / ground有=緑 / それ以外=枠のみ
      if(ov){ ctx.fillStyle=ovFill; poly(sh.reserved); ctx.fill(); }
      else if(sh.ground){ ctx.fillStyle='rgba(79,138,123,.18)'; poly(sh.reserved); ctx.fill(); }
      ctx.setLineDash([5,4]); ctx.strokeStyle=ovCol||'#6E5820'; ctx.lineWidth=ov?1.6:1; poly(sh.reserved); ctx.stroke(); ctx.setLineDash([]);
      // body（本体重なりは赤で強調）
      ctx.fillStyle=ov==='body'?'rgba(210,75,75,.24)':(on?'rgba(212,169,60,.22)':'rgba(220,229,226,.10)');
      ctx.strokeStyle=on?'#D4A93C':(ov==='body'?'#D24B4B':'#9fb0ac'); ctx.lineWidth=on?2:1.2; poly(sh.body); ctx.fill(); ctx.stroke();
    } else {
      const [cx,cy]=w2c(sh.center.d,sh.center.w);
      if(ov){ ctx.fillStyle=ovFill; ctx.beginPath();ctx.arc(cx,cy,sh.rr*camo.scale,0,7);ctx.fill(); }
      else if(sh.ground){ ctx.fillStyle='rgba(79,138,123,.18)'; ctx.beginPath();ctx.arc(cx,cy,sh.rr*camo.scale,0,7);ctx.fill(); }
      ctx.setLineDash([5,4]); ctx.strokeStyle=ovCol||'#6E5820'; ctx.lineWidth=ov?1.6:1; ctx.beginPath();ctx.arc(cx,cy,sh.rr*camo.scale,0,7);ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=ov==='body'?'rgba(210,75,75,.24)':(on?'rgba(212,169,60,.22)':'rgba(220,229,226,.10)');
      ctx.strokeStyle=on?'#D4A93C':(ov==='body'?'#D24B4B':'#9fb0ac'); ctx.lineWidth=on?2:1.2;
      ctx.beginPath();ctx.arc(cx,cy,sh.r*camo.scale,0,7);ctx.fill();ctx.stroke();
    }
    const c0=w2c((e.relPos||{}).d||0,(e.relPos||{}).w||0);
    ctx.fillStyle='#DCE5E2';ctx.font=(11*devicePixelRatio)+'px monospace';ctx.fillText(e.type,c0[0]+4,c0[1]-4);
  });
  { const bn=ovl.bodyPairs, mn=ovl.marginPairs;
    if(bn||mn){ ctx.fillStyle=bn?'#D24B4B':'#D9902B'; ctx.font='bold '+(13*devicePixelRatio)+'px monospace'; ctx.fillText('conflict: (body:'+bn+'、margin:'+mn+')', 8*devicePixelRatio, 20*devicePixelRatio); } }
  function poly(pts){ ctx.beginPath(); pts.forEach((p,k)=>{const [x,y]=w2c(p.d,p.w); k?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.closePath(); }
}

/* ---------- 保存先（File System Access API + IndexedDB）: mc-blueprint から流用 ---------- */
const FS_OK=!!(window.showDirectoryPicker);
function idb(mode,fn){ return new Promise((res,rej)=>{ const r=indexedDB.open('cb',1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
  r.onsuccess=()=>{ const tx=r.result.transaction('kv',mode); const out=fn(tx.objectStore('kv')); tx.oncomplete=()=>res(out&&out.result); tx.onerror=()=>rej(tx.error); };
  r.onerror=()=>rej(r.error); }); }
const idbSet=(k,v)=>idb('readwrite',s=>s.put(v,k)), idbGet=k=>idb('readonly',s=>s.get(k));
async function ensurePerm(h){ const o={mode:'readwrite'}; if(await h.queryPermission(o)==='granted') return true; return (await h.requestPermission(o))==='granted'; }
let DIR=null;
function updateDirLabel(){ const el=$('#dirlabel-plan'); if(!el) return; el.textContent=FS_OK?(DIR?('plan → '+DIR.name+'/ に上書き保存'):'plan → 未設定（ダウンロード）'):''; $('#fs-note').style.display=FS_OK?'none':''; $('#fs-rows').style.display=FS_OK?'':'none'; }
async function pickDir(){ if(!FS_OK){status('この端末は保存先指定に非対応');return;} try{ const h=await window.showDirectoryPicker({mode:'readwrite',id:'cb-plan'}); DIR=h; try{await idbSet('dir_plan',h);}catch(_){} updateDirLabel(); status('保存先: '+h.name); }catch(_){} }
async function saveFile(text,fname){
  if(DIR){ try{ if(await ensurePerm(DIR)){ const fh=await DIR.getFileHandle(fname,{create:true}); const w=await fh.createWritable(); await w.write(text); await w.close(); status('保存: '+DIR.name+'/'+fname); return; } }catch(_){} status('保存先に書けません→ダウンロード'); }
  const b=new Blob([text],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=fname; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); status('保存（ダウンロード）');
}

/* ---------- open plan.json ---------- */
function importPlan(text){
  try{ const d=JSON.parse(text); if(!d||!Array.isArray(d.entries)) throw 0;
    plan={entries:d.entries.map(e=>({relPos:{d:(e.relPos&&e.relPos.d)||0,h:(e.relPos&&e.relPos.h)||0,w:(e.relPos&&e.relPos.w)||0},relDir:e.relDir||'FRONT',...e}))};
    sel=-1; persist(); renderEntries(); renderEditor(); fitCam(); status('読み込みました（'+plan.entries.length+'件）');
  }catch(_){ status('plan.json の解析に失敗'); }
}

/* ---------- wire ---------- */
function boot(){
  $('#add').onclick=()=>{ if(!SCHEMA){status('データ未読込');return;} plan.entries.push(newEntry($('#addtype').value)); sel=plan.entries.length-1; persist(); renderEntries(); renderEditor(); };
  $('#save').onclick=()=>{ const n=($('#name').value||'my_plan').replace(/\.json$/,''); saveFile(buildPlanJson(), n+'.json'); };
  $('#open').onclick=async ()=>{
    if(FS_OK){
      try{
        const opts={types:[{description:'plan.json',accept:{'application/json':['.json']}}]};
        if(DIR) opts.startIn=DIR;                 // 設定した保存先フォルダから開く
        const [fh]=await window.showOpenFilePicker(opts);
        const f=await fh.getFile(); importPlan(await f.text());
      }catch(err){ if(err && err.name!=='AbortError') status('開けません: '+err.message); }
      return;
    }
    $('#file').click(); // 非対応環境はファイル選択にフォールバック
  };
  $('#file').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importPlan(r.result); r.readAsText(f); ev.target.value=''; };
  $('#fit').onclick=fitCam;
  $('#zin').onclick=()=>{camo.scale*=1.25;render();};
  $('#zout').onclick=()=>{camo.scale/=1.25;render();};
  $('#ver').onclick=()=>$('#vmodal').classList.add('on');
  $('#vmodal').onclick=e=>{if(e.target.id==='vmodal')$('#vmodal').classList.remove('on');};
  $('#s-open').onclick=()=>{updateDirLabel();$('#smodal').classList.add('on');};
  $('#smodal').onclick=e=>{if(e.target.id==='smodal')$('#smodal').classList.remove('on');};
  $('#pick').onclick=pickDir;
  // canvas: エントリを掴んで配置（relPos.d/w をブロック単位で決定）/ 空きはパン
  let drag=null;
  function ptWorld(e){ const r=cv.getBoundingClientRect(); const px=(e.clientX-r.left)*devicePixelRatio, py=(e.clientY-r.top)*devicePixelRatio; return {px,py, d:(camo.y-py)/camo.scale, w:(px-camo.x)/camo.scale}; }
  cv.onpointerdown=e=>{
    const p=ptWorld(e), hit=pickAt(p.d,p.w,p.px,p.py); cv.setPointerCapture(e.pointerId);
    if(hit>=0){ sel=hit; const rp=plan.entries[hit].relPos||(plan.entries[hit].relPos={d:0,h:0,w:0}); drag={mode:'entry', gd:p.d-(rp.d||0), gw:p.w-(rp.w||0)}; renderEntries(); renderEditor(); render(); }
    else drag={mode:'pan', x:e.clientX, y:e.clientY, ox:camo.x, oy:camo.y};
  };
  cv.onpointermove=e=>{
    if(!drag){ const p=ptWorld(e); cv.style.cursor=candidatesAt(p.d,p.w,p.px,p.py).length?'grab':'default'; return; }
    if(drag.mode==='pan'){ camo.x=drag.ox+(e.clientX-drag.x)*devicePixelRatio; camo.y=drag.oy+(e.clientY-drag.y)*devicePixelRatio; render(); return; }
    const p=ptWorld(e), rp=plan.entries[sel].relPos; rp.d=Math.round(p.d-drag.gd); rp.w=Math.round(p.w-drag.gw); cv.style.cursor='grabbing'; render(); syncEditorPos();
  };
  cv.onpointerup=()=>{ if(drag&&drag.mode==='entry'){ persist(); renderEntries(); renderEditor(); } drag=null; cv.style.cursor='default'; };
  // R キー: 選択中エントリの relDir を 90°回転
  addEventListener('keydown',e=>{
    const t=(e.target.tagName||'').toLowerCase(); if(t==='input'||t==='select'||t==='textarea') return;
    if((e.key==='r'||e.key==='R')&&sel>=0&&sel<plan.entries.length){ const o=['FRONT','RIGHT','BACK','LEFT']; const en=plan.entries[sel]; en.relDir=o[(o.indexOf(en.relDir||'FRONT')+1)%4]; persist(); renderEntries(); renderEditor(); }
  });
  addEventListener('resize',render);
  // restore local plan
  try{ const raw=localStorage.getItem('city-blueprint:plan'); if(raw){ const d=JSON.parse(raw); if(d&&Array.isArray(d.entries)) plan=d; } }catch(_){}
}
function fillVer(){ $('#vbody').innerHTML=['app '+APP_VERSION,'schema '+(SCHEMA_VER??'?'),'presets '+(PRESETS_VER??'?'),'dict '+(DICT_VER??'?')].map(s=>'<div class="vrow">'+s+'</div>').join(''); }

boot();
loadData().then(()=>{ $('#addtype').innerHTML=allTypes().map(t=>'<option>'+t+'</option>').join(''); fillVer(); renderEntries(); renderEditor(); renderJson(); fitCam(); status('schema/presets 読込 OK'); })
  .catch(err=>{ console.error(err); status('schema.json/presets.json を読めません（sync-from-mod を実行）'); });
updateDirLabel();
if(FS_OK) idbGet('dir_plan').then(h=>{ if(h){ DIR=h; updateDirLabel(); } }).catch(()=>{});
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
